[project]
name = "tsdk"
version = "0.2.0"
description = "TSDK: platform and SDK for serious exergames on TTEA"
requires-python = ">=3.14"
dependencies = [
    # 1.0.1 aborts in PoseLandmarker on macOS ("graph_service.h: Service is unavailable").
    "mediapipe==1.0.0",
    "numpy==2.5.3",
    "opencv-contrib-python==5.0.0.93",
    "packaging>=26,<27",
    "platformdirs==4.12.3",
    "pygame-ce==2.5.8",
    "pyside6>=6.11,<7",
]

[project.scripts]
tsdk = "tsdk.cli:main"

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsdk = ["*.txt", "models/*.task", "models/*.txt"]
