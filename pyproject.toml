[project]
name = "tsdk"
version = "0.1.0"
description = "TSDK: SDK for serious exergames on TTEA"
requires-python = ">=3.14"
dependencies = ["t-tea>=2.0,<3", "packaging>=26,<27", "pyside6>=6.11,<7"]

[project.scripts]
tsdk = "tsdk.cli:main"

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
t-tea = { path = "../ttea", editable = true }
